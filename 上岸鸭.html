.xl-chrome-ext-dialog {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 400px;
  padding: 24px 20px 20px;
  background: #fff;
  border-radius: 12px;
  box-sizing: border-box;
  border: 1px solid var(--border-border-2, #d8dade);
  box-shadow:
    0px 8px 35px 0px rgba(0, 0, 0, 0.07),
    0px 3px 16px 0px rgba(0, 0, 0, 0.05);
  transform: translate3d(-50%, -50%, 0);
  z-index: 2147483647 !important;
  user-select: none;
  font-family:
    'microsoft yahei',
    -apple-system,
    'PingFang SC',
    'simsun',
    Arial,
    sans-serif !important;
  color: #565b66;
  font-size: 14px;
  font-weight: 400;
  line-height: 22px;
  /* 157.143% */
}

.xl-chrome-ext-dialog__title {
  overflow: hidden;
  color: #212429;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin: 0px;

  font-size: 16px;
  font-weight: 400;
  line-height: 24px;

}

  margin-top: 20px;

  list-style: none;
}

.xl-chrome-ext-dialog__content-li {
  display: flex;
  align-items: center;

}

  background-repeat: no-repeat;

  margin-top: 16px;
}

.xl-chrome-ext-recall-dialog__content p {
  padding: 0px;
  margin: 0px;

  color: var(--font-font-2, #565b66);
  font-family: Microsoft YaHei;
  font-size: 12px;
  font-style: normal;
  font-weight: 400;
  line-height: 24px;

  text-align: center;
  font-family: Microsoft YaHei;
  font-size: 16px;
  font-style: normal;
  font-weight: 700;
  line-height: 24px;

  color: var(--error-error, #ff4d4f);
  opacity: 0;
}

.xl-chrome-ext-recall-dialog__content p.error a {
  color: #3f85ff;
  cursor: pointer;
}

.xl-chrome-ext-recall-dialog__carouselItem {

  display: none;
  align-items: center;
  flex-direction: column;
}

.xl-chrome-ext-recall-dialog__footer {
  display: flex;
  margin-top: 16px;
  gap: 12px;
}

.xl-chrome-ext-recall-dialog__footer button {
  width: 120px;
  height: 40px;
  padding: 4px 12px;
  border-radius: var(--border-radius-m, 8px);
  border: 1px solid var(--border-border-2, #d8dade);
  background: #fff;
  cursor: pointer;
}

.xl-chrome-ext-recall-dialog__footer button.blue {
  color: #fff;
  background: #3f85ff;
}

  box-sizing: border-box;
  position: fixed;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid red;
  top: 50px;
  left: 50%;

  font-size: 14px;
  font-weight: 400;

  border-radius: 8px;
  border: 1px solid #d8dade;

@keyframes shine {
  0% {
    opacity: 1;
    background-position: -100px 0;
  }

  50%,
  100% {
    opacity: 0.5;

.xl-chrome-ext-dialog {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 400px;
  padding: 24px 20px 20px;
  background: #fff;
  border-radius: 12px;
  box-sizing: border-box;
  border: 1px solid var(--border-border-2, #d8dade);
  box-shadow:
    0px 8px 35px 0px rgba(0, 0, 0, 0.07),
    0px 3px 16px 0px rgba(0, 0, 0, 0.05);
  transform: translate3d(-50%, -50%, 0);
  z-index: 2147483647 !important;
  user-select: none;
  font-family:
    'microsoft yahei',
    -apple-system,
    'PingFang SC',
    'simsun',
    Arial,
    sans-serif !important;
  color: #565b66;
  font-size: 14px;
  font-weight: 400;
  line-height: 22px;
  /* 157.143% */
}

.xl-chrome-ext-dialog__title {
  overflow: hidden;
  color: #212429;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin: 0px;

  font-size: 16px;
  font-weight: 400;
  line-height: 24px;

}

  margin-top: 20px;

  list-style: none;
}

.xl-chrome-ext-dialog__content-li {
  display: flex;
  align-items: center;

}

  background-repeat: no-repeat;

  margin-top: 16px;
}

.xl-chrome-ext-recall-dialog__content p {
  padding: 0px;
  margin: 0px;

  color: var(--font-font-2, #565b66);
  font-family: Microsoft YaHei;
  font-size: 12px;
  font-style: normal;
  font-weight: 400;
  line-height: 24px;

  text-align: center;
  font-family: Microsoft YaHei;
  font-size: 16px;
  font-style: normal;
  font-weight: 700;
  line-height: 24px;

  color: var(--error-error, #ff4d4f);
  opacity: 0;
}

.xl-chrome-ext-recall-dialog__content p.error a {
  color: #3f85ff;
  cursor: pointer;
}

.xl-chrome-ext-recall-dialog__carouselItem {

  display: none;
  align-items: center;
  flex-direction: column;
}

.xl-chrome-ext-recall-dialog__footer {
  display: flex;
  margin-top: 16px;
  gap: 12px;
}

.xl-chrome-ext-recall-dialog__footer button {
  width: 120px;
  height: 40px;
  padding: 4px 12px;
  border-radius: var(--border-radius-m, 8px);
  border: 1px solid var(--border-border-2, #d8dade);
  background: #fff;
  cursor: pointer;
}

.xl-chrome-ext-recall-dialog__footer button.blue {
  color: #fff;
  background: #3f85ff;
}

  box-sizing: border-box;
  position: fixed;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid red;
  top: 50px;
  left: 50%;

  font-size: 14px;
  font-weight: 400;

  border-radius: 8px;
  border: 1px solid #d8dade;

@keyframes shine {
  0% {
    opacity: 1;
    background-position: -100px 0;
  }

  50%,
  100% {
    opacity: 0.5;
